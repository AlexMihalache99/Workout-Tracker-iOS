# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:

      - name: List installed Xcode versions
        run: ls /Applications | grep Xcode

      - name: List simulator runtimes for default Xcode
        run: xcrun simctl list runtimes

      - name: Show xcode-select path
        run: xcode-select -p
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show installed Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Show destinations eligible for this scheme
        run: |
          xcodebuild -project WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker \
            -showdestinations

      - name: Find an eligible iOS Simulator destination
        id: sim
        run: |
          xcodebuild -project WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker \
            -showdestinations > /tmp/destinations.txt 2>&1

          UDID=$(grep 'platform:iOS Simulator' /tmp/destinations.txt \
            | grep -o -E 'id:[0-9A-Fa-f-]+' \
            | head -n 1 \
            | cut -d: -f2)

          if [ -z "$UDID" ]; then
            echo "No eligible iOS Simulator destination found." >&2
            exit 1
          fi

          echo "Found simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
